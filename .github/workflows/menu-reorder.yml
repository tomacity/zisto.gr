name: Menu reorder checks
on:
  push:
    paths:
      - 'src/lib/menu-reorder.js'
      - 'tests/menu-reorder.test.mjs'
      - '.github/workflows/menu-reorder.yml'
  pull_request:
    paths:
      - 'src/lib/menu-reorder.js'
      - 'tests/menu-reorder.test.mjs'
      - '.github/workflows/menu-reorder.yml'
permissions:
  contents: read
jobs:
  reorder:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/menu-reorder.test.mjs
